version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        # puppeteer is a devDependency for scripts/capture-screenshots.mjs only;
        # skip its ~150 MB Chrome download in the build
        - export PUPPETEER_SKIP_DOWNLOAD=true
        - bun install
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - ~/.bun/install/cache/**/*
customRules:
  - source: "/<*>"
    target: /index.html
    status: "200"
