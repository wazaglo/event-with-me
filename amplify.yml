version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - ~/.bun/install/cache/**/*
customRules:
  - source: "/<*>"
    target: /index.html
    status: "200"
