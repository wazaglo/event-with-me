name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - "amplify.yml"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # OIDC token for the scoped deploy role
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bun run lint
          bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://c8geb0yr98.execute-api.us-east-1.amazonaws.com/prod
          VITE_COGNITO_USER_POOL_ID: us-east-1_e1cUWBLbn
          VITE_COGNITO_CLIENT_ID: 6kdvj9dg78eani8c88qurco01b
          VITE_AWS_REGION: us-east-1

      - name: Ensure SPA rewrites on the Amplify app
        run: |
          # ZIP deployments bypass amplify.yml, so the SPA fallback lives on
          # the app itself (idempotent; also covers first-time setup).
          aws amplify update-app --app-id d2378xfhyngm6g \
            --custom-rules '[{"source":"/<*>","target":"/index.html","status":"200"}]' \
            --query app.customRules --output text

      - name: Upload dist to Amplify
        run: |
          # Manual ZIP deploy: Amplify serves the ZIP ROOT as the web root, so
          # the bundle contains dist/'s contents at top level (index.html,
          # assets/, ...), not a dist/ subdirectory.
          # A previous job stuck in PENDING blocks create-deployment
          # (BadRequestException "last job N was not finished"); get-branch's
          # activeJob does not reliably surface such jobs, so parse the job id
          # out of the error and stop it before retrying.
          set -euo pipefail
          (cd dist && zip -qr "$GITHUB_WORKSPACE/amplify-deploy.zip" .)
          resp=""
          created=""
          for attempt in 1 2 3; do
            if resp="$(aws amplify create-deployment \
                --app-id d2378xfhyngm6g --branch-name main 2>&1)"; then
              created=yes
              break
            fi
            stuck="$(echo "$resp" | grep -oE 'last job\(deployment\) [0-9]+' | grep -oE '[0-9]+')"
            if [ -z "$stuck" ]; then echo "$resp" >&2; exit 1; fi
            echo "stopping stuck Amplify job $stuck (attempt $attempt)"
            aws amplify stop-job --app-id d2378xfhyngm6g --branch-name main --job-id "$stuck" >/dev/null || true
            sleep 5
          done
          [ -n "$created" ] || { echo "create-deployment kept failing: $resp" >&2; exit 1; }
          # Response keys are top-level: {"jobId": ..., "zipUploadUrl": ...}
          upload_url="$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["zipUploadUrl"])')"
          job_id="$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["jobId"])')"
          curl -sf -X PUT -T amplify-deploy.zip "$upload_url"
          # The upload does not always auto-start the job; start it explicitly
          # and wait until Amplify reports the deployment outcome.
          # Status lives at job.summary.status (job.status is null).
          aws amplify start-deployment --app-id d2378xfhyngm6g \
            --branch-name main --job-id "$job_id" >/dev/null
          status=""
          for _ in $(seq 1 30); do
            status="$(aws amplify get-job --app-id d2378xfhyngm6g \
              --branch-name main --job-id "$job_id" \
              --query job.summary.status --output text)"
            case "$status" in
              PENDING|PROVISIONING|UPLOADING|"") sleep 5 ;;
              *) break ;;
            esac
          done
          echo "Amplify job $job_id: $status"
          [ "$status" = "SUCCEED" ]
