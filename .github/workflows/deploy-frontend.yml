name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - "amplify.yml"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # OIDC token for the scoped deploy role
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          bun run lint
          bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://c8geb0yr98.execute-api.us-east-1.amazonaws.com/prod
          VITE_COGNITO_USER_POOL_ID: us-east-1_e1cUWBLbn
          VITE_COGNITO_CLIENT_ID: 6kdvj9dg78eani8c88qurco01b
          VITE_AWS_REGION: us-east-1

      - name: Upload dist to Amplify
        run: |
          # Manual ZIP deploy: Amplify serves the ZIP ROOT as the web root, so
          # the bundle contains dist/'s contents at top level (index.html,
          # assets/, ...), not a dist/ subdirectory.
          # A previous job stuck in PENDING/UPLOADING blocks new deployments
          # (BadRequestException), so cancel whatever is active first.
          active="$(aws amplify get-branch --app-id d2378xfhyngm6g \
            --branch-name main --query branch.activeJob.jobId --output text)"
          if [ "$active" != "None" ] && [ -n "$active" ]; then
            echo "stopping stale job $active"
            aws amplify stop-job --app-id d2378xfhyngm6g --branch-name main --job-id "$active"
            sleep 5
          fi
          (cd dist && zip -qr "$GITHUB_WORKSPACE/amplify-deploy.zip" .)
          resp="$(aws amplify create-deployment \
            --app-id d2378xfhyngm6g \
            --branch-name main)"
          upload_url="$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["deployment"]["zipUploadUrl"])')"
          job_id="$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["deployment"]["jobId"])')"
          curl -sf -X PUT -T amplify-deploy.zip "$upload_url"
          # The upload does not always auto-start the job; start it explicitly
          # and wait until Amplify reports the deployment outcome.
          aws amplify start-deployment --app-id d2378xfhyngm6g \
            --branch-name main --job-id "$job_id" >/dev/null
          status="$(aws amplify get-job --app-id d2378xfhyngm6g \
            --branch-name main --job-id "$job_id" \
            --query job.status --output text)"
          for _ in $(seq 1 30); do
            [ "$status" != "PENDING" ] && [ "$status" != "PROVISIONING" ] \
              && [ "$status" != "UPLOADING" ] && break
            sleep 5
            status="$(aws amplify get-job --app-id d2378xfhyngm6g \
              --branch-name main --job-id "$job_id" \
              --query job.status --output text)"
          done
          echo "Amplify job $job_id: $status"
          [ "$status" = "SUCCEED" ]
