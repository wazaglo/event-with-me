name: Deploy Lambda Code

on:
  push:
    branches: [main, dvlp]
    paths:
      - "backend/**/*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        function:
          - { name: event-with-me-CreateEvent, file: backend/events/createEvent.py }
          - { name: event-with-me-ListEvents, file: backend/events/listEvents.py }
          - { name: event-with-me-UpdateEvent, file: backend/events/updateEvent.py }
          - { name: event-with-me-GetEvent, file: backend/events/getEvent.py }
          - { name: event-with-me-DeleteEvent, file: backend/events/deleteEvent.py }
          - {
              name: event-with-me-RegisterParticipant,
              file: backend/registrations/registerParticipant.py,
            }
          - {
              name: event-with-me-ListRegistrations,
              file: backend/registrations/listRegistrations.py,
            }
          - {
              name: event-with-me-GetRegistrations,
              file: backend/registrations/getRegistrations.py,
            }
          - {
              name: event-with-me-DeleteRegistration,
              file: backend/registrations/deleteRegistration.py,
            }
          - { name: event-with-me-CheckIn, file: backend/registrations/checkIn.py }
          - {
              name: event-with-me-WalkInRegistration,
              file: backend/registrations/walkInRegistration.py,
            }
          - {
              name: event-with-me-UpdateRegistration,
              file: backend/registrations/updateRegistration.py,
            }
          - { name: event-with-me-PrintBadge, file: backend/registrations/printBadge.py }
          - { name: event-with-me-GetAuditLog, file: backend/registrations/getAuditLog.py }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Switch ${{ matrix.function.name }} to python3.13
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ matrix.function.name }} \
            --runtime python3.13
          aws lambda wait function-updated \
            --function-name ${{ matrix.function.name }}

      - name: Zip and deploy ${{ matrix.function.name }}
        run: |
          mkdir -p /tmp/function/shared
          cp ${{ matrix.function.file }} /tmp/function/
          cp backend/shared/*.py /tmp/function/shared/
          cd /tmp/function
          zip -r /tmp/deploy.zip .
          aws lambda update-function-code \
            --function-name ${{ matrix.function.name }} \
            --zip-file fileb:///tmp/deploy.zip
          aws lambda wait function-updated \
            --function-name ${{ matrix.function.name }}
