name: Deploy Lambda Code

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**/*.py"
  push:
    branches: [main, dvlp]
    paths:
      - "backend/**/*.py"

permissions:
  id-token: write # OIDC token for the scoped deploy role
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  deploy:
    # main/dvlp pushes and manual dispatches deploy; PRs stop at tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    environment: production # requires AWS_DEPLOY_ROLE_ARN as environment secret/variable
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy all Lambda functions
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          failed=""
          for f in backend/events/*.py backend/registrations/*.py backend/notifications/*.py; do
            name="$(basename "$f" .py)"
            fn="event-with-me-$(echo "$name" | sed 's/^./\U&/')"
            mkdir -p "$tmp/$name/shared"
            cp "$f" "$tmp/$name/$name.py"
            cp backend/shared/*.py "$tmp/$name/shared/"
            (cd "$tmp/$name" && zip -qr "$tmp/$name.zip" .)
            echo "::group::deploy $fn"
            if aws lambda update-function-code \
                 --function-name "$fn" \
                 --zip-file "fileb://$tmp/$name.zip" \
               && aws lambda wait function-updated --function-name "$fn"; then
              echo "deployed $fn"
            else
              echo "::error::$fn failed"
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed functions:$failed"
            exit 1
          fi

      - name: Redeploy API stage
        run: |
          api_id="$(aws apigateway get-rest-apis --query \
            'items[?name==`event-with-me-api`].id' --output text)"
          aws apigateway create-deployment --rest-api-id "$api_id" --stage-name prod \
            --description "gha ${{ github.sha }}"
          echo "stage prod redeployed (api $api_id)"
