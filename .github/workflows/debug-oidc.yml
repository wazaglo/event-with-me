name: Debug OIDC Claims
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Show sub claim and x5c chain fingerprints
        run: |
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$tok" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -c 'import sys,json;p=json.load(sys.stdin);print("sub:",p.get("sub"));print("aud:",p.get("aud"));print("env:",p.get("environment"));print("ref:",p.get("ref"))'
          echo "$tok" | cut -d. -f1 > /tmp/hdr.json
          python3 - <<'PY'
          import json,base64,subprocess,tempfile,os
          hdr=json.load(open("/tmp/hdr.json"))
          for i,cert_b64 in enumerate(hdr.get("x5c",[])):
              der=base64.b64decode(cert_b64)
              with tempfile.NamedTemporaryFile(suffix=".der",delete=False) as f:
                  f.write(der); path=f.name
              fp=subprocess.run(["openssl","x509","-inform","DER","-in",path,"-noout","-subject","-fingerprint","-sha1"],capture_output=True,text=True).stdout
              print(f"x5c[{i}]:", fp.replace("\n"," | "))
              os.unlink(path)
          PY
