name: Debug OIDC Claims
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Print token claims (payload only, not the token)
        run: |
          token="${{ steps.tokens.outputs.id-token }}"
          echo "claims: audience=${{ github.token }}" >/dev/null
          payload=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;t=json.load(sys.stdin)["value"];p=t.split(".")[1];import base64;print(base64.urlsafe_b64decode(p+"==").decode())')
          echo "$payload" | python3 -m json.tool
