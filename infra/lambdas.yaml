{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "event-with-me compute (Lambda functions) stack",
  "Parameters": {
    "CodeBucket": {
      "Type": "String",
      "Description": "S3 bucket holding lambda zips (uploaded by scripts/deploy-stack.sh)"
    },
    "CodePrefix": {
      "Type": "String",
      "Default": "event-with-me/",
      "Description": "S3 key prefix for lambda zips"
    },
    "AllowedOrigin": {
      "Type": "String",
      "Default": "*",
      "Description": "CORS origin injected into Lambda responses"
    },
    "SourceEmail": {
      "Type": "String",
      "Default": "noreply@yourorg.com",
      "Description": "Verified SES sender identity for confirmation emails; must be verified in SES before any mail is sent"
    }
  },
  "Resources": {
    "LambdaRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Fn::Sub": "event-with-me-lambda-role"
        },
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        ],
        "Policies": [
          {
            "PolicyName": "dynamodb-access",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:UpdateItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:Query",
                    "dynamodb:Scan"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/event-with-me-events"
                    },
                    {
                      "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/event-with-me-registrations"
                    },
                    {
                      "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/event-with-me-registrations/index/*"
                    },
                    {
                      "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/event-with-me-audit-logs"
                    }
                  ]
                }
              ]
            }
          },
          {
            "PolicyName": "sns-publish",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "sns:Publish",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:event-with-me-confirmations"
                    }
                  ]
                }
              ]
            }
          }
        ]
      }
    },
    "CreateEventFunction": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": [
        "LambdaRole"
      ],
      "Properties": {
        "FunctionName": "event-with-me-CreateEvent",
        "Runtime": "python3.13",
        "Architectures": [
          "x86_64"
        ],
        "Handler": "createEvent.handler",
        "Role": {
          "Fn::GetAtt": [
            "LambdaRole",
            "Arn"
          ]
        },
        "Timeout": 15,
        "MemorySize": 256,
        "Code": {
          "S3Bucket": {
            "Ref": "CodeBucket"
          },
          "S3Key": {
            "Fn::Sub": "${CodePrefix}createEvent.zip"
          }
        },
        "Environment": {
          "Variables": {
            "EVENTS_TABLE": {
              "Fn::ImportValue": "event-with-me-data-EventsTable"
            },
            "REGISTRATIONS_TABLE": {
              "Fn::ImportValue": "event-with-me-data-RegistrationsTable"
            },
            "AUDIT_TABLE": {
              "Fn::ImportValue": "event-with-me-data-AuditTable"
            },
            "ALLOWED_ORIGIN": {
              "Ref": "AllowedOrigin"
            },
            "SNS_TOPIC_ARN": {
              "Fn::ImportValue": "event-with-me-data-ConfirmationTopicArn"
            }
          }
        }
      }
    },
